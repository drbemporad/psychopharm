    "Preoperative anxiety/apprehension":                                  ["Other Indications", "Perioperative Use"],

    // ── Amantadine ────────────────────────────────────────────────────────────
    "Levodopa-Induced Dyskinesia in Parkinson's Disease (Gocovri ER)":   ["Movement Disorders", "Parkinson's Disease"],
    "Parkinson's Disease — adjunct (IR)":                                 ["Movement Disorders", "Parkinson's Disease"],
    "Drug-Induced Extrapyramidal Reactions":                              ["Movement Disorders", "Drug-induced EPS"],
    // ── Olanzapine/Fluoxetine (Symbyax) ──────────────────────────────────────
    "Bipolar I Depression (acute)":                                       ["Bipolar Disorder", "Bipolar Depression"],
    "Treatment-Resistant Depression (adjunct)":                           ["Depressive Disorders", "Treatment-Resistant Depression"],
  };

  // Build inverted map: catLabel → { canonRow → [{drug, rawInd, cls}] }
  const indMap = useMemo(() => {
    const map = {};
    const drugClassLookup = {};
    DRUG_DATA.forEach(d => { drugClassLookup[d.generic] = d.class; });

    Object.entries(FDA_INDICATIONS).forEach(([drug, inds]) => {
      inds.forEach(rawInd => {
        const mapping = CANON_MAP[rawInd];
        // mapping can be [cat, row] or [[cat,row],[cat,row]] for cross-listing
        const pairs = !mapping
          ? [["Other Indications", rawInd]]
          : (Array.isArray(mapping[0]) ? mapping : [mapping]);
        pairs.forEach(([catLabel, canonRow]) => {
          if (!map[catLabel]) map[catLabel] = {};
          if (!map[catLabel][canonRow]) map[catLabel][canonRow] = [];
          // Avoid duplicates when multiple raw strings resolve to same drug+row
          if (!map[catLabel][canonRow].some(e => e.drug === drug)) {
            map[catLabel][canonRow].push({ drug, rawInd, cls: drugClassLookup[drug] || "" });
          }
        });
      });
    });
    return map;
  }, []);

  const [indSearch, setIndSearch] = useState("");
  const [expandedCats, setExpandedCats] = useState(() => {
    const init = {};
    IND_CATEGORIES.forEach(c => { init[c.label] = true; });
    return init;
  });
  const [expandedInds, setExpandedInds] = useState({});

  const toggleCat = (label) => setExpandedCats(prev => ({ ...prev, [label]: !prev[label] }));
  const toggleInd = (key)   => setExpandedInds(prev => ({ ...prev, [key]: !prev[key] }));

  const sq = indSearch.toLowerCase().trim();

  const catMatchesSearch = (catLabel) => {
    if (!sq) return true;
    const inds = indMap[catLabel] || {};
    return Object.entries(inds).some(([canon, entries]) =>
      canon.toLowerCase().includes(sq) ||
      entries.some(e => e.drug.toLowerCase().includes(sq) || e.rawInd.toLowerCase().includes(sq))
    );
  };

  const indMatchesSearch = (canon, entries) => {
    if (!sq) return true;
    return canon.toLowerCase().includes(sq) ||
      entries.some(e => e.drug.toLowerCase().includes(sq) || e.rawInd.toLowerCase().includes(sq));
  };

  const goToDrug = (drugName) => {
    const found = DRUG_DATA.find(d => d.generic === drugName);
    if (found) { setTab("search"); setSelected(found); setDetailTab("pk"); window.scrollTo(0, 0); }
  };

  const totalDrugsShown = useMemo(() =>
    new Set(Object.values(indMap).flatMap(inds => Object.values(inds).flatMap(e => e.map(x => x.drug)))).size
  , [indMap]);

  const Highlight = ({ text }) => {
    if (!sq || !text.toLowerCase().includes(sq)) return <span>{text}</span>;
    const idx = text.toLowerCase().indexOf(sq);
    return <span>{text.slice(0, idx)}<mark style={{ background: "#5b8dee33", color: "#93c5fd", borderRadius: 2 }}>{text.slice(idx, idx + sq.length)}</mark>{text.slice(idx + sq.length)}</span>;
  };

  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: "#e8ecf4", marginBottom: 5, letterSpacing: "-0.01em" }}>FDA Indications Chart</h2>
        <p style={{ fontSize: 13, color: "#6d6d6d", lineHeight: 1.6, maxWidth: 720 }}>
          All {totalDrugsShown} drugs sorted by FDA-approved indication. Click any drug to view its full profile.
        </p>
      </div>

      {/* Search */}
      <div style={{ marginBottom: 14, position: "relative" }}>
        <input
          type="text"
          placeholder="Search indications or drug names…"
          value={indSearch}
          onChange={e => {
            setIndSearch(e.target.value);
            if (e.target.value) {
              const exp = {};
              IND_CATEGORIES.forEach(c => { exp[c.label] = true; });
              setExpandedCats(exp);
            }
          }}
          style={{ width: "100%", padding: "10px 14px 10px 36px", background: "#191919", border: "1.5px solid #2d2d2d", borderRadius: 8, color: "#e8ecf4", fontSize: 14, outline: "none" }}
        />
        <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#5b5b5b", fontSize: 15, pointerEvents: "none" }}>⌕</span>
        {indSearch && <button onClick={() => setIndSearch("")} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#6d6d6d", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>✕</button>}
      </div>

      {/* Expand / Collapse all */}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[["Expand all", true], ["Collapse all", false]].map(([label, val]) => (
          <button key={label} onClick={() => { const s = {}; IND_CATEGORIES.forEach(c => { s[c.label] = val; }); setExpandedCats(s); }}
            style={{ background: "#191919", border: "1px solid #2d2d2d", borderRadius: 6, color: "#6d6d6d", fontSize: 12, padding: "4px 12px", cursor: "pointer" }}>
            {label}
          </button>
        ))}
      </div>

      {/* Category accordions */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {IND_CATEGORIES.map(cat => {
          const inds = indMap[cat.label] || {};
          if (Object.keys(inds).length === 0) return null;
          if (!catMatchesSearch(cat.label)) return null;
          const isExpanded = expandedCats[cat.label];
          const totalInCat = new Set(Object.values(inds).flatMap(e => e.map(x => x.drug))).size;

          return (
            <div key={cat.label} style={{ border: `1.5px solid ${cat.color.border}22`, borderRadius: 10, overflow: "hidden", background: "#0f0f0f" }}>
              <button onClick={() => toggleCat(cat.label)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 16px", background: cat.color.bg + "66", border: "none", cursor: "pointer", textAlign: "left" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontWeight: 700, fontSize: 13.5, color: cat.color.text }}>{cat.label}</span>
                  <span style={{ fontSize: 11, color: cat.color.text + "99", background: cat.color.bg, border: `1px solid ${cat.color.border}44`, borderRadius: 10, padding: "1px 8px" }}>
                    {Object.keys(inds).length} indication{Object.keys(inds).length !== 1 ? "s" : ""} · {totalInCat} drug{totalInCat !== 1 ? "s" : ""}
                  </span>
                </div>
                <span style={{ color: cat.color.text + "88", fontSize: 13, flexShrink: 0 }}>{isExpanded ? "▲" : "▼"}</span>
              </button>

              {isExpanded && (
                <div style={{ padding: "4px 0 8px" }}>
                  {Object.entries(inds)
                    .filter(([canon, entries]) => indMatchesSearch(canon, entries))
                    .sort(([a], [b]) => a.localeCompare(b))
                    .map(([canon, entries]) => {
                      const indKey = cat.label + "||" + canon;
                      const isIndExpanded = expandedInds[indKey] !== false;
                      const sorted = [...entries].sort((a, b) => a.drug.localeCompare(b.drug));
                      return (
                        <div key={indKey} style={{ borderTop: "1px solid #1a1e28" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 16px 5px", cursor: "pointer" }} onClick={() => toggleInd(indKey)}>
                            <span style={{ color: cat.color.border, fontSize: 10, flexShrink: 0 }}>{isIndExpanded ? "▾" : "▸"}</span>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#dddddd", flex: 1 }}><Highlight text={canon} /></span>
                            <span style={{ fontSize: 11, color: "#494949", flexShrink: 0 }}>{sorted.length} drug{sorted.length !== 1 ? "s" : ""}</span>
                          </div>
                          {isIndExpanded && (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, padding: "2px 16px 10px 26px" }}>
                              {sorted.map(({ drug, rawInd, cls }) => {
                                const gs = getGroupStyle(cls);
                                return (
                                  <button key={drug + rawInd} onClick={() => goToDrug(drug)} title={rawInd}
                                    style={{ background: gs.bg, border: `1px solid ${gs.border}`, borderRadius: 6, padding: "4px 10px", color: gs.text, fontSize: 12, fontWeight: 600, cursor: "pointer", lineHeight: 1.4, transition: "filter 0.1s" }}
                                    onMouseEnter={e => e.currentTarget.style.filter = "brightness(1.4)"}
                                    onMouseLeave={e => e.currentTarget.style.filter = "none"}>
                                    <Highlight text={drug} />
                                  </button>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 14, padding: "10px 14px", background: "#111111", borderRadius: 8, border: "1px solid #1a1e28", fontSize: 11, color: "#5b5b5b", lineHeight: 1.8 }}>
        <strong style={{ color: "#6d6d6d" }}>Notes: </strong>
        FDA-approved indications only — off-label uses are not listed here. Click any drug pill to open its full profile. Some drugs appear under multiple categories. Pediatric age thresholds and formulation-specific restrictions are shown in the drug detail view.
      </div>
    </div>
  );
}

function LAIGuide() {
  const [selected, setSelected] = useState(null);
  const [genFilter, setGenFilter] = useState("All");
  const [expandedSection, setExpandedSection] = useState("initiation");

  const filtered = [...LAI_DATA.filter(d => genFilter === "All" || d.generation === genFilter)]
    .sort((a, b) => a.brand.localeCompare(b.brand));

  const drug = selected ? LAI_DATA.find(d => d.drug === selected) : null;

  const pkRow = (label, value) => value ? (
    <div style={{ display: "flex", gap: 10, paddingBottom: 7, borderBottom: "1px solid #1a1a1a", alignItems: "flex-start" }}>
      <div style={{ fontSize: 11, color: "#6b9fd4", fontWeight: 600, minWidth: 160, flexShrink: 0 }}>{label}</div>

  const section = (id, title, content) => (
    <div style={{ marginBottom: 8 }}>
      <button onClick={() => setExpandedSection(expandedSection === id ? null : id)}
        style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
          background: expandedSection === id ? "#0d1a2e" : "#141414", border: "1px solid",
          borderColor: expandedSection === id ? "#2a4a7a" : "#232323", borderRadius: 6,

                    fontSize: 11, fontWeight: 700, padding: "2px 6px", borderRadius: 3,

            { drug: "Aristada", items: ["Oral aripiprazole 10 mg → 441 mg/mo", "Oral aripiprazole 15 mg → 662 mg/mo", "Oral aripiprazole 20 mg → 882 mg/mo or 1,064 mg q8w"] },
            { drug: "Zyprexa Relprevv", items: ["Oral olanzapine 10 mg → 210 mg q2w or 405 mg q4w", "Oral olanzapine 15 mg → 300 mg q2w", "Oral olanzapine 20 mg → 300 mg q2w × 8 wk then 405 mg q4w"] },

                  borderLeft: "2px solid #1e2e40" }}>
                  {item}
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>

      {/* Key clinical pearls */}
      <div style={{ background: "#0a0f0a", border: "1px solid #1a2a1a", borderRadius: 8, padding: 18 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#6ee7a0", marginBottom: 14, letterSpacing: "0.03em", textTransform: "uppercase" }}>
          Key Clinical Pearls
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 10 }}>
          {[
            { title: "Flip-flop kinetics", detail: "All LAIs exhibit absorption-rate limited PK — time to steady-state is determined by absorption rate, not elimination t½. This is why apparent t½ values are much longer than oral formulations of the same drug." },
            { title: "Loading dose logistics", detail: "PP1M (Sustenna/Erzofri) has the most robust loading dose evidence — therapeutic levels within days of Day 1 deltoid injection. Aristada Initio enables same-day aripiprazole LAI start. Clozapine has no LAI formulation." },
            { title: "Oral bridge imperative", detail: "Risperdal Consta and Rykindo REQUIRE a 3-week oral bridge after the first injection — the microsphere lag phase means no therapeutic drug is released for the first 21 days." },
            { title: "No-bridge options", detail: "Perseris, Uzedy, Invega Sustenna (with loading), and Erzofri achieve therapeutic levels rapidly — no oral bridge required when properly initiated." },
            { title: "Renal dosing critical for paliperidone", detail: "All paliperidone LAIs (Sustenna, Trinza, Hafyera, Erzofri) are predominantly renally eliminated — CONTRAINDICATED or dose-reduced in CrCl <50 mL/min. Check renal function before prescribing." },
            { title: "REMS: Zyprexa Relprevv only", detail: "Olanzapine pamoate is the only LAI with a REMS program (PDSS risk). 3-hour post-injection observation mandatory. No other LAIs require REMS." },
            { title: "PP step-up pathway", detail: "PP6M (Hafyera) requires ≥4 months of PP3M (Trinza); PP3M requires ≥4 months of PP1M (Sustenna/Erzofri). Cannot skip steps. This stepwise stabilization pathway is regulatory and clinical." },
            { title: "CYP interactions", detail: "Aripiprazole LAIs: dose-reduce with strong 2D6 or 3A4 inhibitors. Paliperidone LAIs: avoid strong CYP3A4/P-gp inducers (carbamazepine, rifampin). Haloperidol/fluphenazine: 2D6 substrate — PMs have markedly higher levels." },
            { title: "Missed dose window matters", detail: "Each LAI has a specific dosing window. Paliperidone PP6M allows ±2–3 weeks. Aripiprazole q2mo allows ±14 days. Always check labeling — managing a late dose correctly prevents re-initiation." },
          ].map(p => (
            <div key={p.title} style={{ background: "#0d0d0d", border: "1px solid #1e2e1e", borderRadius: 6, padding: "10px 12px" }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#5abf7a", marginBottom: 4 }}>{p.title}</div>
              <div style={{ fontSize: 11, color: "#7a9a7a", lineHeight: 1.6 }}>{p.detail}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

    { drug:"Olanzapine-Samidorphan", gen:"Olanzapine-Samidorphan", class:"SGA", sed:"++", wt:"++", dm:"++", eps:"+/–", ach:"+",  htn:"+",   prl:"+"  },
    { drug:"Olanzapine/Fluoxetine",gen:"Olanzapine/Fluoxetine",class:"SGA", sed:"++",  wt:"+++", dm:"+++", eps:"+/–",  ach:"+",    htn:"+",   prl:"+"  },
    { drug:"Paliperidone",         gen:"Paliperidone",         class:"SGA", sed:"+",   wt:"++",  dm:"+",   eps:"+",    ach:"+",    htn:"++",  prl:"+++"},
    { drug:"Quetiapine",           gen:"Quetiapine",           class:"SGA", sed:"++",  wt:"++",  dm:"++",  eps:"–",    ach:"+",    htn:"++",  prl:"–"  },
    { drug:"Risperidone",          gen:"Risperidone",          class:"SGA", sed:"+",   wt:"++",  dm:"+",   eps:"+",    ach:"+",    htn:"++",  prl:"+++"},
    { drug:"Xanomeline-Trospium",  gen:"Xanomeline-Trospium",  class:"SGA", sed:"+/–", wt:"–",   dm:"–",   eps:"–",    ach:"+/–",  htn:"+/–", prl:"–"  },
    { drug:"Ziprasidone",          gen:"Ziprasidone",          class:"SGA", sed:"+",   wt:"+/–", dm:"–",   eps:"+/–",  ach:"–",    htn:"+",   prl:"+/–"},
  ];

  // Numeric SE data cross-reference: drug → { effect → string label }
  // Sources: FDA prescribing information (placebo-controlled trials), Stahl/Taylor Table 2.40
  // sed=somnolence; wt=≥7% weight gain; eps=EPS/akathisia; htn=orthostatic hypotension
  const SE_NUMS = {
    // FGAs — pre-modern label era; systematic placebo-controlled numeric tables not available
    "Pimozide":       { sed:"common (label)", wt:"uncommon", eps:"high (label)", htn:"uncommon" },
    "Thioridazine":   { sed:"marked (label)", wt:"common (label)", eps:"low (label)", htn:"marked (label)" },
    "Promethazine":   { sed:"very common (label)", wt:"uncommon", eps:"low-mod (label)", htn:"mod (label)" },
    "Chlorpromazine": { sed:"common (label)", wt:"common (label)", eps:"mod (label)", htn:"marked (label)" },
    "Fluphenazine":   { sed:"low (label)", wt:"low (label)", eps:"~25–40% (label)", htn:"low (label)" },
    "Haloperidol":    { sed:"~12% vs 5%", wt:"low (label)", eps:"~40–75% (high dose)", htn:"~4% vs 2%" },
    "Loxapine":       { sed:"common (label)", wt:"uncommon", eps:"high (label)", htn:"mod (label)" },
    "Perphenazine":   { sed:"~12% vs 6%", wt:"uncommon", eps:"~25–30% (label)", htn:"low (label)" },
    // SGAs — FDA label placebo-controlled trial data
    "Aripiprazole":   { sed:"11% vs 6%", wt:"8% vs 3% (≥7%)", eps:"10% akathisia vs 4%", htn:"1% vs 0.3%" },
    "Asenapine":      { sed:"24% vs 8%", wt:"5% vs 2% (≥7%)", eps:"7% EPS vs 3%", htn:"~3% vs 2%" },
    "Brexpiprazole":  { sed:"5% vs 3%", wt:"8% vs 4% (≥7%)", eps:"4% akathisia vs 2%", htn:"~2% vs 1%" },
    "Cariprazine":    { sed:"8% vs 5%", wt:"8% vs 4% (≥7%)", eps:"20% akathisia vs 5%", htn:"~2% vs 1%" },
    "Clozapine":      { sed:"46%", wt:"~30–40% (long-term)", eps:"rare (<1%)", htn:"9%" },
    "Iloperidone":    { sed:"15% vs 6%", wt:"12% vs 4% (≥7%)", eps:"~5% EPS vs 3%", htn:"5% vs 1%" },
    "Lurasidone":     { sed:"17% vs 7%", wt:"5% vs 3% (≥7%)", eps:"13% akathisia vs 3%", htn:"~3% vs 2%" },
    "Lumateperone":   { sed:"24% vs 10%", wt:"5% vs 4% (≥7%)", eps:"2% akathisia vs 2%", htn:"~2% vs 1%" },
    "Olanzapine":     { sed:"29% vs 12%", wt:"29% vs 3% (≥7%)", eps:"5% akathisia vs 1%", htn:"~3% vs 2%" },
    "Olanzapine/Fluoxetine": { sed:"~29%", wt:"~29% (olanzapine component)", eps:"~5% (olanzapine component)", htn:"~3% (olanzapine component)" },
    "Olanzapine-Samidorphan": { sed:"~29% vs 12%", wt:"26% vs 5% (≥7%, ENLIGHTEN-1)", eps:"2% vs 2% (ENLIGHTEN-1)", htn:"3.7% (24-wk study)" },
    "Paliperidone":   { sed:"11% vs 6%", wt:"9% vs 2% (≥7%)", eps:"12% parkinsonism vs 6%", htn:"~4% vs 2%" },
    "Quetiapine":     { sed:"34% vs 6%", wt:"23% vs 6% (≥7%)", eps:"rare (~1%)", htn:"7% vs 2%" },
    "Risperidone":    { sed:"33% vs 13%", wt:"9% vs 1% (≥7%)", eps:"26% akathisia vs 10%", htn:"2% vs 0%" },
    "Xanomeline-Trospium": { sed:"5% vs 4%", wt:"2% vs 3% (lower than PBO)", eps:"2% akathisia vs 1%", htn:"2% vs 1%" },
    "Milsaperidone":  { sed:"~15% vs 6%*", wt:"~12% vs 4%* (≥7%)", eps:"~5% vs 3%*", htn:"~5% vs 1%*" },
    "Ziprasidone":    { sed:"31% vs 9%", wt:"10% vs 4% (≥7%)", eps:"8% akathisia vs 7%", htn:"~5% vs 3%" },
  };

  const RATING_ORDER = { "–": 0, "+/–": 1, "+": 2, "++": 3, "+++": 4 };
  const RATING_COLORS = {
    "–":   { bg: "#0a1a0a", text: "#4ade80", border: "#16a34a" },
    "+/–": { bg: "#1a1a08", text: "#a3a028", border: "#78700a" },
    "+":   { bg: "#1a1208", text: "#fb923c", border: "#c2410c" },
    "++":  { bg: "#1a0808", text: "#f87171", border: "#dc2626" },
    "+++": { bg: "#1a0808", text: "#fca5a5", border: "#ef4444" },
    "++++":{ bg: "#120508", text: "#ff8080", border: "#991b1b" },
    null:  { bg: "#141414", text: "#5b5b5b", border: "#2d2d2d" },
  };

  const COLS = [
    { key:"sed", label:"Sedation" },
    { key:"wt",  label:"Weight Gain" },
    { key:"dm",  label:"Diabetes Risk" },
    { key:"eps", label:"EPS" },
    { key:"ach", label:"Anticholinergic" },
    { key:"htn", label:"Hypotension" },
    { key:"prl", label:"Prolactin ↑" },
  ];

  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState("desc");
  const [hovered, setHovered] = useState(null); // {row, col}

  const sq = search.toLowerCase().trim();

  const displayed = useMemo(() => {
    let rows = AP_TABLE.filter(r => {
      if (filter !== "All" && r.class !== filter) return false;
      if (sq && !r.drug.toLowerCase().includes(sq)) return false;
      return true;
    });
    if (sortCol) {
      rows = [...rows].sort((a, b) => {
        const av = RATING_ORDER[a[sortCol]] ?? -1;
        const bv = RATING_ORDER[b[sortCol]] ?? -1;
        return sortDir === "desc" ? bv - av : av - bv;
      });
    }
    return rows;
  }, [filter, sq, sortCol, sortDir]);

  const toggleSort = (key) => {
    if (sortCol === key) {
      setSortDir(d => d === "desc" ? "asc" : "desc");
    } else {
      setSortCol(key);
      setSortDir("desc");
    }
  };

  const goToDrug = (gen) => {
    if (!gen) return;
    const found = DRUG_DATA.find(d => d.generic === gen);
    if (found) { setTab("search"); setSelected(found); setDetailTab("pk"); window.scrollTo(0, 0); }
  };

  const RatingCell = ({ row, col }) => {
    const val = row[col.key];
    const colors = RATING_COLORS[val] || RATING_COLORS[null];
    const nums = SE_NUMS[row.drug];
    const numStr = nums && nums[col.key] ? nums[col.key] : null;
    const isHov = hovered && hovered.row === row.drug && hovered.col === col.key;
    return (
      <td
        onMouseEnter={() => setHovered({row: row.drug, col: col.key})}
        onMouseLeave={() => setHovered(null)}
        style={{
          background: isHov ? colors.bg + "dd" : colors.bg,
          border: `1px solid ${colors.border}${isHov ? "88" : "33"}`,
          padding: "0",
          textAlign: "center",
          position: "relative",
          transition: "all 0.1s",
          minWidth: 72,
        }}
      >
        <div style={{ padding: "6px 4px" }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: val ? colors.text : "#353535", letterSpacing: "0.02em" }}>
            {val || "—"}
          </div>
          {numStr && (
            <div style={{ fontSize: 9.5, color: colors.text + "99", marginTop: 2, lineHeight: 1.3 }}>
              {numStr}
            </div>
          )}
        </div>
      </td>
    );
  };

  const fgaRows = displayed.filter(r => r.class === "FGA");
  const sgaRows = displayed.filter(r => r.class === "SGA");

  const SectionRows = ({ rows, label }) => {
    if (rows.length === 0) return null;
    return (
      <>
        <tr>
          <td colSpan={COLS.length + 1} style={{
            background: "#111111", color: "#5b5b5b", fontSize: 11,
            fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase",
            padding: "6px 12px", borderTop: "1px solid #1a1e28"
          }}>
            {label}
          </td>
        </tr>
        {rows.map(row => (
          <tr key={row.drug} style={{ background: "#0f0f0f" }}>
            <td style={{
              padding: "6px 12px", fontSize: 12.5, fontWeight: 600,
              color: row.gen ? "#93c5fd" : "#757575",
              cursor: row.gen ? "pointer" : "default",
              whiteSpace: "nowrap",
              borderRight: "1px solid #1a1e28",
              borderBottom: "1px solid #111418",
            }}
              onClick={() => goToDrug(row.gen)}
              title={row.gen ? "Click to open drug profile" : "Not in app database"}
            >
              {row.drug}
              {!row.gen && <span style={{ fontSize: 9, color: "#494949", marginLeft: 4 }}>†</span>}
            </td>
            {COLS.map(col => <RatingCell key={col.key} row={row} col={col} />)}
          </tr>
        ))}
      </>
    );
  };

  return (
    <div>
      {/* Header */}
      <div style={{ marginBottom: 16 }}>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: "#e8ecf4", marginBottom: 5, letterSpacing: "-0.01em" }}>
          Antipsychotic Side Effect Chart
        </h2>
        <p style={{ fontSize: 13, color: "#6d6d6d", lineHeight: 1.6, maxWidth: 760 }}>
          Relative adverse effect profiles for antipsychotics. Ratings from Table 2.40 (Taylor et al.); numeric percentages from individual FDA label placebo-controlled trials where available. Click any drug name to open its full profile.
        </p>
      </div>

      {/* Rating legend */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14, alignItems: "center" }}>
        <span style={{ fontSize: 11, color: "#5b5b5b", marginRight: 4 }}>Relative severity:</span>
        {["–", "+/–", "+", "++", "+++"].map(r => {
          const c = RATING_COLORS[r];
          return (
            <span key={r} style={{ background: c.bg, border: `1px solid ${c.border}`, borderRadius: 5, padding: "2px 10px", fontSize: 12, fontWeight: 700, color: c.text }}>
              {r}
            </span>
          );
        })}
        <span style={{ fontSize: 11, color: "#494949", marginLeft: 8 }}>† not in app database</span>
      </div>

      {/* Controls */}
      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 160 }}>
          <input type="text" placeholder="Search drug…" value={search} onChange={e => setSearch(e.target.value)}
            style={{ width: "100%", padding: "8px 12px 8px 32px", background: "#191919", border: "1.5px solid #2d2d2d", borderRadius: 7, color: "#e8ecf4", fontSize: 13, outline: "none" }} />
          <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#5b5b5b", fontSize: 14, pointerEvents: "none" }}>⌕</span>
          {search && <button onClick={() => setSearch("")} style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#6d6d6d", cursor: "pointer", fontSize: 14 }}>✕</button>}
        </div>
        {["All","FGA","SGA"].map(f => (
          <button key={f} onClick={() => setFilter(f)}
            style={{ padding: "7px 16px", background: filter === f ? "#1d4ed8" : "#191919", border: `1px solid ${filter === f ? "#2563eb" : "#2d2d2d"}`, borderRadius: 7, color: filter === f ? "#e8ecf4" : "#6d6d6d", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
            {f === "All" ? "All antipsychotics" : f === "FGA" ? "FGA / 1st gen" : "SGA / 2nd gen"}
          </button>
        ))}
      </div>

      {/* Hint */}
      <p style={{ fontSize: 11, color: "#494949", marginBottom: 10 }}>
        Click any column header to sort. Hover a cell for details where available.
      </p>

      {/* Table */}
      <div style={{ overflowX: "auto", borderRadius: 10, border: "1.5px solid #1a1e28" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 640 }}>
          <thead>
            <tr style={{ background: "#111111" }}>
              <th style={{ padding: "9px 12px", textAlign: "left", fontSize: 11, fontWeight: 700, color: "#5b5b5b", letterSpacing: "0.06em", textTransform: "uppercase", borderBottom: "1.5px solid #1a1e28", whiteSpace: "nowrap" }}>Drug</th>
              {COLS.map(col => (
                <th key={col.key} onClick={() => toggleSort(col.key)}
                  style={{ padding: "9px 8px", textAlign: "center", fontSize: 11, fontWeight: 700, color: sortCol === col.key ? "#93c5fd" : "#5b5b5b", letterSpacing: "0.06em", textTransform: "uppercase", borderBottom: "1.5px solid #1a1e28", cursor: "pointer", whiteSpace: "nowrap", userSelect: "none", minWidth: 72 }}>
                  {col.label} {sortCol === col.key ? (sortDir === "desc" ? "▼" : "▲") : "⇅"}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filter === "SGA" ? (
              <SectionRows rows={sgaRows} label="Second-Generation Antipsychotics (SGA)" />
            ) : filter === "FGA" ? (
              <SectionRows rows={fgaRows} label="First-Generation Antipsychotics (FGA)" />
            ) : (
              <>
                <SectionRows rows={fgaRows} label="First-Generation Antipsychotics (FGA)" />
                <SectionRows rows={sgaRows} label="Second-Generation Antipsychotics (SGA)" />
              </>
            )}
          </tbody>
        </table>
      </div>

      {/* Footer notes */}
      <div style={{ marginTop: 12, padding: "10px 14px", background: "#111111", borderRadius: 8, border: "1px solid #1a1e28", fontSize: 11, color: "#5b5b5b", lineHeight: 1.9 }}>
        <strong style={{ color: "#6d6d6d" }}>Rating scale: </strong>
        <strong style={{ color: "#4ade80" }}>–</strong> very low &nbsp;·&nbsp;
        <strong style={{ color: "#a3a028" }}>+/–</strong> low/variable &nbsp;·&nbsp;
        <strong style={{ color: "#fb923c" }}>+</strong> low &nbsp;·&nbsp;
        <strong style={{ color: "#f87171" }}>++</strong> moderate &nbsp;·&nbsp;
        <strong style={{ color: "#fca5a5" }}>+++</strong> high incidence/severity
        <br />
        <strong style={{ color: "#6d6d6d" }}>Sources: </strong>
        Table ratings adapted from Taylor et al., <em>The Maudsley Prescribing Guidelines</em> (Table 2.40); numeric % from individual FDA product labels (placebo-controlled trials).
        Ratings are approximate estimates of relative incidence and severity based on clinical experience, manufacturers' literature, and published research.
        <br />† Drug not currently in the app database.
      </div>
    </div>
  );
}

function DoseEquivalencies() {
  const [sortCol, setSortCol] = useState("eqDiazepam_ashton");
  const [sortDir, setSortDir] = useState("asc");
  const [filter, setFilter] = useState("All");
  const [expandedDrug, setExpandedDrug] = useState(null);

  const durationColors = {
    "Short":        { bg: "#3a1a0a", border: "#7a3a1a", text: "#e8a060" },
    "Intermediate": { bg: "#1a2a0a", border: "#3a5a1a", text: "#8ab860" },
    "Long":         { bg: "#0a1a2a", border: "#1a3a5a", text: "#60a0e8" },
  };

  const filtered = BENZO_DATA.filter(d => filter === "All" || d.duration === filter);
  const sorted = [...filtered].sort((a, b) => {
    const av = a[sortCol], bv = b[sortCol];
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    const result = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv));
    return sortDir === "asc" ? result : -result;
  });

  const toggleSort = col => {
    if (sortCol === col) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortCol(col); setSortDir("asc"); }
  };

  const SortIcon = ({ col }) => sortCol !== col ? null : (
    <span style={{ marginLeft: 3, opacity: 0.7 }}>{sortDir === "asc" ? "↑" : "↓"}</span>
  );

  const thStyle = (col, w) => ({
    padding: "9px 10px", textAlign: "left", color: "#5b5b5b",
    fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.05em",
    cursor: "pointer", userSelect: "none", whiteSpace: "nowrap",
    borderBottom: "1px solid #1e1e1e", width: w,

  return (
    <div style={{ maxWidth: 1100 }}>

        Values vary between individuals and are not exact — use as a guide for cross-tapering, not for precise dosing.
        Two reference sources shown: <span style={{ color: "#5b8dee" }}>Ashton Manual (2002)</span> and <span style={{ color: "#60b87a" }}>VA/DoD SUD CPG (2021)</span>.

      {/* Source legend */}

        {[
          { label: "Short-acting (t½ < 12 h)", ...durationColors["Short"] },
          { label: "Intermediate (t½ 12–24 h)", ...durationColors["Intermediate"] },
          { label: "Long-acting (t½ > 24 h)", ...durationColors["Long"] },
        ].map(s => (
          <div key={s.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <div style={{ width: 10, height: 10, borderRadius: 2, background: s.bg, border: `1px solid ${s.border}` }} />
            <span style={{ fontSize: 12, color: "#6d6d6d" }}>{s.label}</span>
          </div>

      </div>

      {/* Filter + sort controls */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
        {["All", "Short", "Intermediate", "Long"].map(f => (
          <button key={f} onClick={() => setFilter(f)}

              borderColor: filter === f ? "#5b8dee" : "#2a2a2a",
              color: filter === f ? "#5b8dee" : "#6d6d6d" }}>

      </div>

      {/* Main table */}
      <div style={{ overflowX: "auto", marginBottom: 32 }}>
        <table style={{ width: "100%", minWidth: 860, borderCollapse: "collapse", fontSize: 12, tableLayout: "fixed" }}>

            <col style={{ width: 180 }} />

                        <div style={{ color: "#3a5a3a", fontSize: 10, marginTop: 2 }}>No active metabolites</div>
                      )}
                    </td>
                    <td style={{ padding: "10px 10px", color: "#6d6d6d", fontSize: 11, lineHeight: 1.5, wordBreak: "break-word" }}>
                      {d.fdaIndications.slice(0, 2).join("; ")}
                      {d.fdaIndications.length > 2 && <span style={{ color: "#4a4a4a" }}> +{d.fdaIndications.length - 2}</span>}
                    </td>
                  </tr>
                  {isExpanded && (
                    <tr key={`${d.generic}-detail`}>
                      <td colSpan={6} style={{ padding: "0 0 2px 0", background: "#070d14", borderBottom: "2px solid #1e3a5a" }}>
                        <div style={{ padding: "16px 20px" }}>
                          {/* Detail header */}
                          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
                            <span style={{ fontSize: 16, fontWeight: 700, color: "#e8ecf4" }}>{d.generic}</span>
                            <span style={{ fontSize: 12, color: "#6d6d6d" }}>{d.brand}</span>
                            <span style={{ fontSize: 11, fontWeight: 700, padding: "2px 7px", borderRadius: 3,
                              background: dc.bg, color: dc.text, border: `1px solid ${dc.border}` }}>
                              {d.duration}-acting
                            </span>
                            {d.beers && (
                              <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 7px", borderRadius: 3,
                                background: "#2a0a0a", color: "#e06060", border: "1px solid #5a1a1a" }}>
                                ⚠ Beers Criteria
                              </span>
                            )}
                          </div>

                          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>
                            {/* PK block */}
                            <div style={{ background: "#0d0d0d", borderRadius: 6, padding: "12px 14px", border: "1px solid #1e1e1e" }}>
                              <div style={{ fontSize: 10, fontWeight: 700, color: "#5b5b5b", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Pharmacokinetics</div>
                              {[
                                ["Parent t½", d.halfLifeParent],
                                ["Total t½ (incl. metabolites)", d.halfLifeTotal],
                                ["Active metabolite", d.activeMetabolite],
                                ["Onset", `~${d.onsetMin} min`],
                                ["Tmax", `~${d.tMaxH} h`],

                                ["DEA Schedule", d.schedule],
                              ].map(([label, val]) => (
                                <div key={label} style={{ display: "flex", gap: 8, marginBottom: 5, fontSize: 12 }}>
                                  <span style={{ color: "#5b5b5b", minWidth: 150, flexShrink: 0 }}>{label}</span>
                                  <span style={{ color: "#9b9b9b", lineHeight: 1.4 }}>{val}</span>

                            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                              {d.fdaIndications.map(ind => (
                                <span key={ind} style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4,

            Equivalency values are approximations based on clinical experience, not pharmacokinetic calculations. 
            They vary significantly between individuals, especially in the elderly, those with hepatic impairment, 
            and those with long-term use. The Ashton and VA/DoD values frequently disagree — both reflect 
            clinical practice rather than controlled equivalence studies.

        <div style={{ background: "#0d0d0d", border: "1px solid #1e1e1e", borderRadius: 8, padding: "14px 16px" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#5b8dee", marginBottom: 8 }}>🔄 Cross-Tapering to Diazepam</div>
          <p style={{ fontSize: 12, color: "#7b7b7b", lineHeight: 1.6 }}>
            The Ashton Manual recommends converting short-acting BZDs (alprazolam, lorazepam) to diazepam 
            before tapering, due to diazepam's long-acting metabolites providing a natural taper. 
            Lorazepam, oxazepam, and temazepam (LOT rule) are preferred in hepatic impairment — 
            no CYP oxidation, no active metabolites.

        <div style={{ fontSize: 11, color: "#5b5b5b", marginBottom: 16 }}>Including active metabolites. Bar spans full range; tick marks at min and max.</div>
        {(() => {
          const MAX_H = 250;
          const parseRange = str => {
            const m = str.match(/(\d+(?:\.\d+)?)[–\-](\d+(?:\.\d+)?)/);
            if (m) return { lo: parseFloat(m[1]), hi: parseFloat(m[2]) };
            const s = parseFloat(str);
            return { lo: s || 1, hi: s || 1 };
          };
          const sorted = [...BENZO_DATA].sort((a, b) => {
            const ra = parseRange(a.halfLifeTotal), rb = parseRange(b.halfLifeTotal);
            return ((ra.lo + ra.hi) / 2) - ((rb.lo + rb.hi) / 2);
          });
          return sorted.map(d => {
            const { lo, hi } = parseRange(d.halfLifeTotal);
            const hiCapped = Math.min(hi, MAX_H);
            const loPos  = (lo / MAX_H) * 100;
            const hiPos  = (hiCapped / MAX_H) * 100;
            const barW   = Math.max(hiPos - loPos, 1);
            const dc = durationColors[d.duration];
            const isOpen = hi > MAX_H;
            return (
              <div key={d.generic} style={{ marginBottom: 10 }}>
                {/* Label row */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 3 }}>
                  <span style={{ fontSize: 12, color: "#c8d0e0", fontWeight: 600 }}>{d.generic}</span>
                  <span style={{ fontSize: 11, color: dc.text, fontWeight: 500 }}>{d.halfLifeTotal}{isOpen ? "+" : ""}</span>
                </div>
                {/* Bar track */}
                <div style={{ position: "relative", height: 12, background: "#1a1a1a", borderRadius: 6, overflow: "visible" }}>
                  {/* Filled range bar */}
                  <div style={{
                    position: "absolute",
                    left: `${loPos}%`,
                    width: `${barW}%`,
                    height: "100%",
                    background: dc.border,
                    borderRadius: 4,
                    opacity: 0.85,
                  }} />
                  {/* Open-ended arrow if range exceeds scale */}
                  {isOpen && (
                    <div style={{
                      position: "absolute", right: -6, top: "50%", transform: "translateY(-50%)",
                      width: 0, height: 0,
                      borderTop: "6px solid transparent", borderBottom: "6px solid transparent",
                      borderLeft: `8px solid ${dc.border}`,
                    }} />
                  )}
                  {/* Min tick */}
                  <div style={{
                    position: "absolute", left: `${loPos}%`,
                    width: 2, height: 18, top: -3,
                    background: dc.text, borderRadius: 1,
                    transform: "translateX(-1px)",
                  }} />
                  {/* Max tick (only if range spans > 2h) */}
                  {(hiPos - loPos) > 1 && (
                    <div style={{
                      position: "absolute", left: `${hiPos}%`,
                      width: 2, height: 18, top: -3,
                      background: dc.text, borderRadius: 1,
                      transform: "translateX(-1px)",
                      opacity: isOpen ? 0.4 : 1,
                    }} />
                  )}
                </div>
              </div>
            );
          });
        })()}
        {/* X-axis */}
        <div style={{ position: "relative", height: 18, marginTop: 10 }}>
          {[0, 50, 100, 150, 200, 250].map(v => (
            <div key={v} style={{ position: "absolute", left: `${(v / 250) * 100}%`, transform: "translateX(-50%)", textAlign: "center" }}>
              <div style={{ width: 1, height: 5, background: "#2a2a2a", margin: "0 auto 2px" }} />
              <span style={{ fontSize: 10, color: "#3a3a3a" }}>{v === 250 ? "250+ h" : `${v}h`}</span>
            </div>
          ))}
        </div>
        {/* Legend */}
        <div style={{ display: "flex", gap: 16, marginTop: 12, flexWrap: "wrap" }}>
          {["Short", "Intermediate", "Long"].map(dur => (
            <div key={dur} style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <div style={{ width: 24, height: 8, borderRadius: 2, background: durationColors[dur].border }} />
              <span style={{ fontSize: 10, color: durationColors[dur].text }}>{dur}</span>
            </div>
          ))}
          <span style={{ fontSize: 10, color: "#3a3a3a", marginLeft: 4 }}>Tick marks = range min / max</span>
        </div>
      </div>

      <div style={{ fontSize: 11, color: "#3a3a3a", lineHeight: 1.7 }}>
        Sources: Ashton CH. <em>Benzodiazepines: How They Work and How to Withdraw</em> (Ashton Manual), 2002. 
        VA/DoD Clinical Practice Guideline for the Management of Substance Use Disorders (SUD CPG), 2021. 
        FDA prescribing information for individual agents. 
        Cloos JM &amp; Ferreira V. <em>CNS Drugs</em> 2009; ASAM Benzodiazepine Tapering Guidelines 2025.
      </div>
    </div>
  );
}

                    <td style={{
                      padding: "7px 14px", fontSize: 13, fontWeight: 600,
                      color: row.gen ? "#60b4f0" : "#9b9b9b",
                      cursor: row.gen ? "pointer" : "default",
                      borderBottom: "1px solid #1e1e1e",
                      whiteSpace: "nowrap",
                    }} onClick={() => goToDrug(row.gen)}
                       title={row.gen ? "Open drug profile" : "Not in app database"}>
                      {row.drug}{!row.gen && <span style={{ fontSize: 9, color: "#3d3d3d", marginLeft: 3 }}>†</span>}
                    </td>
                    {/* QTc rating */}
                    <td style={{ padding: "6px 10px", textAlign: "center", borderBottom: "1px solid #1e1e1e" }}>
                      <RatingBadge val={row.qtc} />
                    </td>
                    {/* Bazett data */}
                    <td style={{ padding: "6px 10px", textAlign: "left", fontSize: 12, borderBottom: "1px solid #1e1e1e", fontVariantNumeric: "tabular-nums" }}>
                      {(() => {
                        if (!row.bazett) return <span style={{ color: "#3d3d3d" }}>—</span>;
                        const tagColors = { W: { bg: "#0a1a10", text: "#4ade80", border: "#166534" }, FDA: { bg: "#0a1020", text: "#60a5fa", border: "#1d4ed8" }, L: { bg: "#1a1000", text: "#fbbf24", border: "#92400e" } };
                        const match = row.bazett.match(/^(.*?)\s*\[([WL]|FDA)\]$/);
                        if (!match) return <span style={{ color: "#bfbfbf" }}>{row.bazett}</span>;
                        const [, val, tag] = match;
                        const tc = tagColors[tag] || tagColors.L;
                        return (
                          <span style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                            <span style={{ color: "#bfbfbf" }}>{val.trim()}</span>
                            <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.05em", padding: "1px 5px", borderRadius: 3, background: tc.bg, color: tc.text, border: `1px solid ${tc.border}`, whiteSpace: "nowrap" }}>{tag}</span>
                          </span>
                        );
                      })()}
                    </td>
                    {/* TdP */}
                    <td style={{ padding: "6px 10px", textAlign: "center", borderBottom: "1px solid #1e1e1e" }}>
                      <RatingBadge val={row.tdp} />
                    </td>
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>

      {/* Footer */}
      <div style={{ marginTop: 12, padding: "10px 14px", background: "#141414", borderRadius: 8, border: "1px solid #2d2d2d", fontSize: 11, color: "#494949", lineHeight: 1.9 }}>
        <strong style={{ color: "#5b5b5b" }}>Source key — </strong>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4, marginRight: 8 }}>
          <span style={{ fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3, background: "#0a1a10", color: "#4ade80", border: "1px solid #166534" }}>W</span>
          Wenzel-Seifert K et al. (2011) <em>Curr Drug Safety</em>; Vieweg WVR (2003) <em>Ann Clin Psychiatry</em> — scraped from uploaded reference tables.
        </span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4, marginRight: 8 }}>
          <span style={{ fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3, background: "#0a1020", color: "#60a5fa", border: "1px solid #1d4ed8" }}>FDA</span>
          Individual FDA product labels (thorough QTc/TQT studies or label safety language) — data not present in the scraped tables.
        </span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
          <span style={{ fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3, background: "#1a1000", color: "#fbbf24", border: "1px solid #92400e" }}>L</span>
          Published literature (case series, observational studies) — for non-FDA-approved drugs without formal TQT data.
        </span>
        <br />QTc ratings: Ø = none at therapeutic concentrations; + = mild (&gt;5–9 ms);
        ++ = moderate (≥9–16 ms); +++ = severe (≥17 ms); N.R. = not reported.
        TdP: + = rare in combination/overdose; ++ = rare under monotherapy; +++ = multiple case reports or studies.
        <br />† Drug not in app database.
      </div>
    </div>
  );
}

                    <td style={tdStyle}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{color:"#e8ecf4",fontVariantNumeric:"tabular-nums",minWidth:34}}>−{d.smd.toFixed(2)}</span>
                        <span style={S.bar(barW(d.smd,0.95),"#5b8dee")}></span>

                      <div style={{fontSize:10,color:"#4d4d4d",marginTop:2}}>{t.label}</div>
                    </td>
                    <td style={{...tdStyle,color:"#6d6d6d",fontSize:12}}>{d.rawED95}</td>
                    <td style={{...tdStyle,fontSize:12,color: isRef?"#5b8dee":"#7d7d7d"}}>{d.risPerMg}</td>
                    <td style={{...tdStyle,fontSize:12,color:"#5b5b5b",minWidth:180}}>{d.trialDose}</td>
                    <td style={{...tdStyle,fontSize:11,color:"#7a7a7a",maxWidth:340,lineHeight:1.55}}>{d.drDetail}</td>
                    <td style={tdStyle}><span style={S.tierPill(t)}>{t.label}</span></td>
                    <td style={{...tdStyle,fontSize:11,color:"#4d4d4d",minWidth:160,lineHeight:1.5}}>{d.smdSource}</td>
                  </tr>
                );
              })}
              {/* Benchmark row */}
              <tr style={{background:"#0c180c"}}>
                <td style={{...tdStyle,fontWeight:600,color:"#4a9b7e"}} colSpan={2}>All APs pooled</td>
                <td style={tdStyle}><span style={{color:"#4a9b7e"}}>−0.47</span><div style={{fontSize:10,color:"#3a6a50"}}>105 RCTs · N=22,741</div></td>
                <td style={{...tdStyle,color:"#3a5a40",fontSize:12}} colSpan={7}>Leucht et al. 2017 Am J Psychiatry · Pooled PANSS MD=9.4 pts (95% CI 8.4–10.2) — class average, all APs combined · NNT=5–6</td>
              </tr>
            </tbody>
          </table>
          <div style={{marginTop:10,fontSize:11,color:"#4d4d4d",lineHeight:1.7}}>
            ‡ Amisulpride not FDA-approved for any psychiatric indication (IV Barhemsys approved for PONV only). Retained per clinical reference value. · Highlighted row = risperidone (reference drug for equivalence calculations). · Sortable: SMD. · PANSS/BPRS per-drug raw point columns removed — no published pooled mean differences vs. placebo exist for individual drugs (Huhn 2019 used SMDs due to mixed PANSS/BPRS trials; Leucht 2017 PANSS MD is a class average only).
          </div>
        </div>

      {/* Source cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10,marginTop:20}}>
        {[
          ["Primary SMD source","Huhn M et al. Lancet 2019;394:939–951. NMA of 32 oral APs, N=52,522."],
          ["Secondary SMD source","Leucht S et al. Lancet 2013;382:951–962. 15-drug NMA."],
          ["Dose-response / ED95","Leucht S et al. Am J Psychiatry 2020;177:342–353. 68 fixed-dose studies. Outcome = PANSS or BPRS reduction vs. placebo."],
          ["Risperidone equivalents","Leucht 2020 Table 1: published mg-per-risperidone-eq for each drug, derived from ED95 ratios."],
          ["BPRS scale data","Davis JM et al. Arch Gen Psychiatry 2003;60:553–564. Leucht S et al. Schizophr Res 1999;35:51–68."],
          ["BPRS/PANSS bridge","Leucht S et al. Neuropsychopharmacology 2006;31:2318. BPRS↓10 ≈ PANSS↓15 ≈ CGI minimally improved (n=5,970)."],
        ].map(([title,body])=>(
          <div key={title} style={S.card}>
            <div style={{fontWeight:600,color:"#9b9b9b",marginBottom:3,fontSize:11,textTransform:"uppercase",letterSpacing:"0.06em"}}>{title}</div>
            <div style={{fontSize:12}}>{body}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Antidepressant Efficacy Chart Component ────────────────────────────────
function AntidepressantEfficacyChart() {
  const [sortCol, setSortCol] = React.useState("smd");
  const [sortDir, setSortDir] = React.useState("desc");
  const [adSubTab, setAdSubTab] = React.useState("table");

  /*
   * Data sources:
   * Primary SMD: Cipriani et al. 2018 Lancet (522 RCTs, N=116,477)
   * Individual drug SMDs vs placebo from NMA estimates (all-trials analysis)
   * HDRS/MADRS raw Δ derived from:
   *   - Hengartner et al. 2020 PLOS ONE (HDRS-17 n=32,399; MADRS n=11,705)
   *   - Pooled SD ~8.5 for HDRS-17; ~10 for MADRS (consensus from Leucht 2013 Neuropsychopharmacol, Hengartner 2020)
   *   - Individual drug Δ = SMD × pooled SD
   * Scale anchors (Leucht et al. 2013 Neuropsychopharmacology; Hengartner 2020):
   *   HDRS-17: range 0–52; typical baseline ~24; min. clinically important diff. = 7 pts (clinician-CGI), 4 pts (patient)
   *   MADRS: range 0–60; typical baseline ~28–32; min. important diff. = 8 pts (clinician), 5 pts (patient)
   *   Pooled drug-placebo diff. all ADs: HDRS-17 = 2.07 pts, MADRS = 2.99 pts (Hengartner 2020)
   *
   * Drug class codes: SSRI, SNRI, TCA, NaSSA, NDRI, SMS, SMA, MAOI
   * Acceptability tier based on all-cause discontinuation ORs vs placebo (Cipriani 2018)
   *   Good = OR<1.0 (fewer dropouts than placebo), Moderate = OR 1.0-1.15, Poor = OR>1.15
   */
  const ADDATA = [

    "Agom:Dulo": {
      acc:[0.62,"0.47–0.82","†",true],
      eff:[1.06,"0.82–1.37","*",false],
    },

      acc:[0.97,"0.74–1.27","†",false],
      eff:[0.90,"0.71–1.14","*",false],
    },
    "Agom:Fluo": {
      acc:[0.85,"0.68–1.05","†",false],

    },

      acc:[0.69,"0.51–0.97","†",true],
      eff:[1.20,"0.91–1.61","*",false],

      eff:[0.51,"0.28–0.92","*",true],
    },
    // ── Sertraline pairs ──────────────────────────────────────────────
    "Sert:Traz": {
      acc:[0.80,"0.58–1.11","†",false],
      eff:[1.26,"0.95–1.67","†",false],
    },
    "Sert:Venl": {
      acc:[0.86,"0.70–1.05","†",false],
      eff:[0.94,"0.78–1.13","†",false],
    },
    "Sert:Vort": {
      acc:[1.45,"0.84–2.54","†",false],
      eff:[0.68,"0.39–1.16","‡",false],
    },
    // ── Trazodone pairs ───────────────────────────────────────────────
    "Traz:Venl": {
      acc:[1.07,"0.77–1.47","‡",false],
      eff:[0.75,"0.57–0.98","*",true],
    },
    "Traz:Vort": {
      acc:[1.80,"0.98–3.38","†",false],
      eff:[0.54,"0.30–0.95","*",true],
    },
    // ── Venlafaxine pairs ─────────────────────────────────────────────
    "Venl:Vort": {
      acc:[1.69,"1.01–2.86","†",true],
      eff:[0.72,"0.43–1.19","‡",false],
    },
  };

  // Helper: get data for any drug pair in canonical order
  function getPair(a, b) {
    const ai = DRUGS.findIndex(d=>d.key===a);
    const bi = DRUGS.findIndex(d=>d.key===b);
    if (ai < bi) return { key:`${a}:${b}`, data: DATA[`${a}:${b}`], firstIsA: true };
    else         return { key:`${b}:${a}`, data: DATA[`${b}:${a}`], firstIsA: false };
  }

  const [selDrug, setSelDrug] = React.useState("Sert");
  const [metric, setMetric] = React.useState("both");

  const sel = DRUGS.find(d=>d.key===selDrug);

  // Quality badge styles
  const qualStyles = {
    "*": {color:"#b8e090", bg:"#1a2e0a", border:"#3a5818", label:"Moderate"},
    "†": {color:"#e8c860", bg:"#28200a", border:"#4a3c10", label:"Low"},
    "‡": {color:"#7888aa", bg:"#0e1220", border:"#1e2c40", label:"Very Low"},
  };

  // For efficacy: sel is "first alpha" if selDrug < comp alphabetically
  // OR>1 favors the first-alpha drug (the col in lower-left)
  // So: if sel comes first (firstIsA=true): OR>1 favors sel = good
  //     if sel comes second (firstIsA=false): OR<1 favors sel = good
  function effFavorsSel(or, firstIsA) {
    return firstIsA ? or > 1 : or < 1;
  }
  // For acceptability: OR<1 favors first-alpha drug
  // if sel comes first: OR<1 favors sel = good
  // if sel comes second: OR>1 favors sel = good  
  function accFavorsSel(or, firstIsA) {
    return firstIsA ? or < 1 : or > 1;
  }

  // Reciprocal for display: always show OR from sel's perspective (>1 = sel favored)
  function effDisplayOR(or, firstIsA) {
    return firstIsA ? or : (or === 0 ? 0 : 1/or);
  }
  function accDisplayOR(or, firstIsA) {
    return firstIsA ? (or === 0 ? 0 : 1/or) : or;
  }

  // Count significant comparisons for summary
  const comparators = DRUGS.filter(d=>d.key!==selDrug);
  const effWins  = comparators.filter(d=>{ const p=getPair(selDrug,d.key); if(!p.data) return false; const [or,,, bold]=p.data.eff; return bold && effFavorsSel(or,p.firstIsA); }).length;
  const effLoss  = comparators.filter(d=>{ const p=getPair(selDrug,d.key); if(!p.data) return false; const [or,,, bold]=p.data.eff; return bold && !effFavorsSel(or,p.firstIsA); }).length;
  const accWins  = comparators.filter(d=>{ const p=getPair(selDrug,d.key); if(!p.data) return false; const [or,,, bold]=p.data.acc; return bold && accFavorsSel(or,p.firstIsA); }).length;
  const accLoss  = comparators.filter(d=>{ const p=getPair(selDrug,d.key); if(!p.data) return false; const [or,,, bold]=p.data.acc; return bold && !accFavorsSel(or,p.firstIsA); }).length;

  return (
    <div>
      <h2 style={{fontSize:20,fontWeight:700,color:"#e8ecf4",marginBottom:4}}>
        Head-to-Head Comparisons
      </h2>
      <p style={{fontSize:12,color:"#5a6a7a",marginBottom:14,lineHeight:1.6,maxWidth:820}}>
        Data from Cipriani 2018 <em>Lancet</em> Table 3. Each card shows the selected drug vs. one comparator.
        ORs shown from selected drug's perspective (OR&nbsp;&gt;&nbsp;1 = selected drug favored for efficacy; OR&nbsp;&lt;&nbsp;1 = selected drug better tolerated).
        <strong style={{color:"#9090a8"}}> Bold + underline</strong> = statistically significant (95% CrI excludes 1.0).
        Evidence quality: <span style={{color:"#b8e090"}}>* Moderate</span> · <span style={{color:"#e8c860"}}>† Low</span> · <span style={{color:"#7888aa"}}>‡ Very Low</span>.
      </p>

      {/* Controls row */}
      <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:12,alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:12,color:"#5a5a7a",fontWeight:600}}>Drug:</span>
          <select value={selDrug} onChange={e=>setSelDrug(e.target.value)} style={{
            background:"#10101c",color:"#c8d8f4",border:"1px solid #2a3a5e",
            borderRadius:6,padding:"5px 10px",fontSize:13,cursor:"pointer",minWidth:160,
          }}>
            {DRUGS.map(d=>(
              <option key={d.key} value={d.key}>{d.full}</option>
            ))}
          </select>
        </div>
        <div style={{display:"flex",gap:3}}>
          {[["both","Both"],["eff","Efficacy"],["acc","Acceptability"]].map(([v,l])=>(
            <button key={v} onClick={()=>setMetric(v)} style={{
              padding:"4px 10px",fontSize:11,fontWeight:600,border:"1px solid",cursor:"pointer",borderRadius:5,
              background: metric===v ? "#141a2e" : "transparent",
              color: metric===v ? "#7ab3f0" : "#404a5a",
              borderColor: metric===v ? "#2a4a7e" : "#1e2030",
            }}>{l}</button>
          ))}
        </div>
      </div>

      {/* Summary bar */}
      <div style={{
        display:"flex",flexWrap:"wrap",alignItems:"center",gap:"4px 18px",
        marginBottom:14,padding:"8px 14px",
        background:"#0a0a14",borderRadius:7,border:"1px solid #141428",fontSize:12,color:"#5a6a7a",
      }}>
        {(metric==="both"||metric==="eff") && <>
          <span style={{color:"#4a5a6a",fontWeight:600}}>Efficacy:</span>
          <span>Sig. more efficacious vs <span style={{color:"#5ad88a",fontWeight:700}}>{effWins}</span></span>
          <span>Sig. less efficacious vs <span style={{color:"#f07878",fontWeight:700}}>{effLoss}</span></span>
          {metric==="both" && <span style={{color:"#1a1a2a",padding:"0 4px"}}>│</span>}
        </>}
        {(metric==="both"||metric==="acc") && <>
          <span style={{color:"#4a5a6a",fontWeight:600}}>Tolerability:</span>
          <span>Sig. better tolerated vs <span style={{color:"#5ad88a",fontWeight:700}}>{accWins}</span></span>
          <span>Sig. worse tolerated vs <span style={{color:"#f07878",fontWeight:700}}>{accLoss}</span></span>
        </>}
      </div>

      {/* Cards grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:6}}>
        {comparators.map(comp => {
          const p = getPair(selDrug, comp.key);
          if (!p.data) return null;
          const { data, firstIsA } = p;
          const [eor, eci, esig, ebold] = data.eff;
          const [aor, aci, asig, abold] = data.acc;
          const eFav = effFavorsSel(eor, firstIsA);
          const aFav = accFavorsSel(aor, firstIsA);
          const eDisp = effDisplayOR(eor, firstIsA);
          const aDisp = accDisplayOR(aor, firstIsA);
          const eq = qualStyles[esig] || qualStyles["‡"];
          const aq = qualStyles[asig] || qualStyles["‡"];

          // Card left border: driven by efficacy significance
          const lbColor = ebold ? (eFav ? "#2a6a42" : "#6a2a2a") : "#1a1a2e";

          return (
            <div key={comp.key} style={{
              background:"#0c0c18",border:"1px solid #181828",
              borderRadius:8,overflow:"hidden",
              borderLeft:`3px solid ${lbColor}`,
            }}>
              {/* Drug name header */}
              <div style={{
                padding:"6px 10px 5px",background:"#101020",
                borderBottom:"1px solid #181828",
              }}>
                <span style={{fontWeight:700,fontSize:12,color:clsColor[comp.cls]||"#aaa"}}>
                  {comp.full}
                </span>
                <span style={{fontSize:10,color:"#3a3a5a",marginLeft:5}}>{comp.cls}</span>
              </div>

              {/* Efficacy section */}
              {(metric==="both"||metric==="eff") && (
                <div style={{
                  padding:"7px 10px 6px",
                  borderBottom: metric==="both" ? "1px solid #14141e" : "none",
                  background: ebold && eFav ? "#0a180e" : ebold && !eFav ? "#180a0a" : "#0c0c18",
                }}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:9,fontWeight:700,color:"#3a5a8a",letterSpacing:"0.07em",textTransform:"uppercase"}}>Efficacy</span>
                    <span style={{
                      fontSize:9,fontWeight:700,padding:"1px 4px",borderRadius:3,
                      background:eq.bg,color:eq.color,border:`1px solid ${eq.border}`,
                    }}>{esig} {eq.label}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"baseline",gap:3}}>
                    <span style={{
                      fontSize:20,fontWeight: ebold ? 800 : 400,
                      color: ebold ? (eFav?"#60e090":"#e06060") : "#3a4a5a",
                      fontVariantNumeric:"tabular-nums",lineHeight:1,
                    }}>{eDisp.toFixed(2)}</span>
                    <span style={{fontSize:10,color: ebold?(eFav?"#40b060":"#b04040"):"#2a3a4a"}}>
                      {eFav ? "▲" : "▼"}
                    </span>
                  </div>
                  <div style={{
                    fontSize:10,marginTop:2,lineHeight:1.3,
                    color: ebold ? (eFav?"#40a060":"#a04040") : "#2a3a4a",
                    fontWeight: ebold ? 700 : 400,
                    textDecoration: ebold ? "underline" : "none",
                    fontVariantNumeric:"tabular-nums",
                  }}>{eci}</div>
                  <div style={{fontSize:9,marginTop:3,color: ebold?(eFav?"#40a060":"#a04040"):"#2a3040",lineHeight:1.2}}>
                    {ebold
                      ? (eFav ? `${sel.full} more efficacious` : `${comp.full} more efficacious`)
                      : "No significant difference"}
                  </div>
                </div>
              )}

              {/* Acceptability section */}
              {(metric==="both"||metric==="acc") && (
                <div style={{
                  padding:"7px 10px 6px",
                  background: abold && aFav ? "#0a180e" : abold && !aFav ? "#180a0a" : "#0a0a14",
                }}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:9,fontWeight:700,color:"#3a6a5a",letterSpacing:"0.07em",textTransform:"uppercase"}}>Tolerability</span>
                    <span style={{
                      fontSize:9,fontWeight:700,padding:"1px 4px",borderRadius:3,
                      background:aq.bg,color:aq.color,border:`1px solid ${aq.border}`,
                    }}>{asig} {aq.label}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"baseline",gap:3}}>
                    <span style={{
                      fontSize:20,fontWeight: abold ? 800 : 400,
                      color: abold ? (aFav?"#60e090":"#e06060") : "#3a4a5a",
                      fontVariantNumeric:"tabular-nums",lineHeight:1,
                    }}>{aDisp.toFixed(2)}</span>
                    <span style={{fontSize:10,color: abold?(aFav?"#40b060":"#b04040"):"#2a3a4a"}}>
                      {aFav ? "▲" : "▼"}
                    </span>
                  </div>
                  <div style={{
                    fontSize:10,marginTop:2,lineHeight:1.3,
                    color: abold ? (aFav?"#40a060":"#a04040") : "#2a3a4a",
                    fontWeight: abold ? 700 : 400,
                    textDecoration: abold ? "underline" : "none",
                    fontVariantNumeric:"tabular-nums",
                  }}>{aci}</div>
                  <div style={{fontSize:9,marginTop:3,color: abold?(aFav?"#40a060":"#a04040"):"#2a3040",lineHeight:1.2}}>
                    {abold
                      ? (aFav ? `${sel.full} better tolerated` : `${comp.full} better tolerated`)
                      : "No significant difference"}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{marginTop:18,padding:"12px 16px",background:"#08080e",borderRadius:8,border:"1px solid #141428",fontSize:11,color:"#4a5a6a",lineHeight:1.9}}>
        <div style={{fontWeight:700,color:"#7a8a9a",marginBottom:6,fontSize:12}}>How to read</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:"2px 24px"}}>
          <div>ORs shown from <strong style={{color:"#c8d0e0"}}>selected drug's perspective</strong></div>
          <div><strong style={{color:"#60e090"}}>▲ OR &gt; 1</strong> (efficacy) = selected drug more efficacious</div>
          <div><strong style={{color:"#60e090"}}>▲ OR &lt; 1</strong> (tolerability) = selected drug better tolerated</div>
          <div><strong style={{color:"#e06060"}}>▼</strong> = comparator favored</div>
          <div><span style={{color:"#c8d0e0",fontWeight:700}}>Bold + underline</span> = 95% CrI excludes 1.0 (statistically significant)</div>
          <div>Non-bold = CrI crosses 1.0</div>
          <div><span style={{color:"#b8e090"}}>* Moderate quality</span> — meaningful limitations</div>
          <div><span style={{color:"#e8c860"}}>† Low quality</span> — estimate may substantially change</div>
          <div><span style={{color:"#7888aa"}}>‡ Very low quality</span> — very uncertain estimate</div>
          <div style={{color:"#3a4a5a"}}>Source: Cipriani A et al. <em>Lancet</em> 2018;391:1357–1366, Table 3</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("search");
  const [query, setQuery] = useState("");
  const [filterGroup, setFilterGroup] = useState("All");
  const [selected, setSelected] = useState(null);
  const [detailTab, setDetailTab] = useState("pk");
  const [switchSel, setSwitchSel] = useState(null);

  const UNIQUE_GROUPS = useMemo(() => {
    const seen = new Set();
    const result = [];
    GROUP_ORDER.forEach(g => {
      if (DRUG_DATA.some(d => getGroup(d.class) === g)) {
        if (!seen.has(g)) { seen.add(g); result.push(g); }
      }
    });
    return result;
  }, []);

  const filtered = useMemo(() => {
    const q = query.toLowerCase();
    return DRUG_DATA.filter(d => {
      const matchGroup = filterGroup === "All" || getGroup(d.class) === filterGroup;
      const matchQuery = !q ||
        d.generic.toLowerCase().includes(q) ||
        d.brand.toLowerCase().includes(q) ||
        d.class.toLowerCase().includes(q) ||
        d.indications.some(i => i.toLowerCase().includes(q)) ||
        d.mechanismOfAction.toLowerCase().includes(q) ||
        (FDA_INDICATIONS[d.generic] || []).some(i => i.toLowerCase().includes(q));
      return matchGroup && matchQuery;
    }).sort((a, b) => a.generic.localeCompare(b.generic));
  }, [query, filterGroup]);

  const cypTable = useMemo(() => {
    const result = {};
    CYP_ENZYMES.forEach(cyp => { result[cyp] = { substrates: [], inhibitors: [], inducers: [] }; });
    DRUG_DATA.forEach(drug => {
      drug.cyp.substrate.forEach(s => {
        const match = CYP_ENZYMES.find(e => s.includes(e));
        if (match) result[match].substrates.push(drug.generic);
      });
      drug.cyp.inhibits.forEach(s => {
        const match = CYP_ENZYMES.find(e => s.includes(e));
        if (match) result[match].inhibitors.push({ drug: drug.generic, note: s });
      });
      drug.cyp.induces.forEach(s => {
        const match = CYP_ENZYMES.find(e => s.includes(e));
        if (match) result[match].inducers.push({ drug: drug.generic, note: s });
      });
    });
    return result;
  }, []);

  const gs = selected ? getGroupStyle(selected.class) : null;
  const qtcColor = (qtc) => {
    const q = (qtc || "").toLowerCase();
    if (q.includes("significant") || q.includes("highest")) return "#f07878";
    if (q.includes("moderate")) return "#e8a840";
    if (q.includes("mild")) return "#f5d170";
    return "#4ade80";
  };

  return (
    <div style={{ fontFamily: "'Inter', 'Segoe UI', system-ui, sans-serif", background: "#141414", minHeight: "100vh", color: "#dddddd" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        ::-webkit-scrollbar-thumb:hover { background: #3d4a5c; }

        /*
         * SURFACE HIERARCHY (lightest-to-darkest so each layer reads clearly):

         *   inner cell   #141414   — recessed inset (same as page = "punched in")
         *   form card    #19191930 — mid surface for formulation blocks

         */

        /* ── Drug cards ── */

        })()}
