        {/* ══════ ANTIPSYCHOTIC SE CHART TAB ══════ */}
        {tab === "apse" && <AntipsychoticSEChart setTab={setTab} setSelected={setSelected} setDetailTab={setDetailTab} />}

        {/* ══════ ANTIPSYCHOTIC EFFICACY TAB ══════ */}
        {tab === "apeff" && <AntipsychoticEfficacyChart />}
        {tab === "adeff" && <AntidepressantEfficacyChart />}

        {/* ══════ LAI GUIDE TAB ══════ */}
        {tab === "lai" && <LAIGuide />}

        {/* ══════ ANTIDEPRESSANT SWITCHING TAB ══════ */}
        {tab === "switch" && (() => {
          const CSTYLE = {
            same:   {bg:"#111111",br:"1px solid #262626",tx:"#3d3d3d"},
            direct: {bg:"#091a0e",br:"1px solid #1a4020",tx:"#5abf7a"},
            std:    {bg:"#0a1420",br:"1px solid #142840",tx:"#6aa8d8"},
            short:  {bg:"#1a1406",br:"1px solid #3a2c08",tx:"#c8a040"},
            medium: {bg:"#1a0c06",br:"1px solid #4a1a08",tx:"#d07850"},
            long:   {bg:"#1e0608",br:"1px solid #5a1010",tx:"#e05050"},
          };
          return (
            <div>
              <div style={{marginBottom:18}}>
                <h2 style={{fontSize:20,fontWeight:700,color:"#e8ecf4",marginBottom:5,letterSpacing:"-0.01em"}}>Antidepressant Switching Guidelines</h2>
                <p style={{fontSize:13,color:"#6d6d6d",lineHeight:1.6,maxWidth:820}}>
                  Based on CINP international consensus guidelines. Find the drug you are switching <strong style={{color:"#9b9b9b"}}>FROM</strong> in the left column, then read across to the drug you are switching <strong style={{color:"#9b9b9b"}}>TO</strong>. Click any cell for full instructions.
                </p>
                <div style={{display:"flex",gap:14,marginTop:12,flexWrap:"wrap"}}>
                  {[["same","#262626","#494949","Same class"],["direct","#1a4020","#5abf7a","Direct / 24h"],["std","#142840","#6aa8d8","Standard taper"],["short","#3a2c08","#c8a040","7-day washout"],["medium","#4a1a08","#d07850","14-day washout"],["long","#5a1010","#e05050","21d+ washout"]].map(([cat,bdr,tx,lbl])=>(
                    <span key={cat} style={{fontSize:11.5,display:"flex",alignItems:"center",gap:6,color:"#6d6d6d"}}>
                      <span style={{width:12,height:12,borderRadius:2,border:`1px solid ${bdr}`,background:CSTYLE[cat].bg,display:"inline-block",flexShrink:0}}></span>
                      <span style={{color:tx}}>{lbl}</span>
                    </span>
                  ))}
                </div>
              </div>

              {switchSel && (
                <div style={{background:"#191919",border:"1.5px solid #5b8dee",borderRadius:10,padding:"16px 20px",marginBottom:18,position:"relative"}}>
                  <button onClick={()=>setSwitchSel(null)} style={{position:"absolute",top:10,right:14,background:"none",border:"none",color:"#6d6d6d",cursor:"pointer",fontSize:17,lineHeight:1,padding:4}}>✕</button>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.09em",textTransform:"uppercase",color:"#5b8dee",marginBottom:10}}>Switching Instructions</div>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:12,flexWrap:"wrap"}}>
                    <div style={{background:"#161616",border:"1px solid #1a3050",borderRadius:6,padding:"7px 14px",minWidth:120}}>
                      <div style={{fontSize:10,color:"#5b5b5b",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:2}}>FROM</div>
                      <div style={{fontSize:14,fontWeight:700,color:"#93c5fd"}}>{switchSel.from}</div>
                      {switchSel.fd && <div style={{fontSize:10.5,color:"#5b5b5b",marginTop:2,lineHeight:1.4}}>{switchSel.fd}</div>}
                    </div>
                    <div style={{fontSize:22,color:"#5b8dee",paddingTop:14}}>&rarr;</div>
                    <div style={{background:"#161616",border:"1px solid #1a3050",borderRadius:6,padding:"7px 14px",minWidth:120}}>
                      <div style={{fontSize:10,color:"#5b5b5b",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:2}}>TO</div>
                      <div style={{fontSize:14,fontWeight:700,color:"#93c5fd"}}>{switchSel.to}</div>
                      {switchSel.td && <div style={{fontSize:10.5,color:"#5b5b5b",marginTop:2,lineHeight:1.4}}>{switchSel.td}</div>}
                    </div>
                    {(()=>{
                      const badges={direct:["Direct / 24h washout","#1a4020","#5abf7a"],short:["7-day washout","#3a2c08","#c8a040"],medium:["14-day washout","#4a1a08","#d07850"],long:["21d+ washout","#5a1010","#e05050"]};
                      const b=badges[switchSel.cat];
                      return b ? <span style={{background:b[1],border:`1px solid ${b[1]}`,borderRadius:5,padding:"5px 11px",fontSize:12,fontWeight:700,color:b[2],alignSelf:"center"}}>{b[0]}</span> : null;
                    })()}
                  </div>
                  <div style={{fontSize:15,color:"#dddddd",lineHeight:1.8,marginTop:4}}>{switchSel.instruction}</div>
                </div>
              )}

              <div style={{overflowX:"auto",borderRadius:10,border:"1.5px solid #262626"}}>
                <table style={{borderCollapse:"collapse",fontSize:11,width:"100%",minWidth:1100}}>
                  <thead>
                    <tr style={{background:"#0f0f0f"}}>
                      <th style={{padding:"12px 12px 10px",borderRight:"2px solid #2d2d2d",borderBottom:"2px solid #2d2d2d",minWidth:112,position:"sticky",left:0,background:"#0f0f0f",zIndex:3,textAlign:"left",verticalAlign:"bottom"}}>
                        <div style={{fontSize:10,lineHeight:1.6}}>
                          <span style={{color:"#6aa8d8",display:"block"}}>FROM ↓</span>
                          <span style={{color:"#3d3d3d",fontSize:20,display:"block",margin:"-2px 0",lineHeight:1}}>⟋</span>
                          <span style={{color:"#93c5fd",display:"block"}}>TO →</span>
                        </div>
                      </th>
                      {SWITCH_COLS.map(col=>(
                        <th key={col.name} style={{padding:"10px 6px",textAlign:"center",borderRight:"1px solid #1a1e28",borderBottom:"2px solid #2d2d2d",minWidth:88,verticalAlign:"bottom"}}>
                          <div style={{fontWeight:700,color:"#e8ecf4",fontSize:12}}>{col.name}</div>
                          {col.detail && <div style={{fontWeight:400,color:"#494949",fontSize:9.5,marginTop:3,lineHeight:1.4}}>{col.detail.split(" · ").map((d,i)=><span key={i} style={{display:"block"}}>{d}</span>)}</div>}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {SWITCH_ROWS.map((row,ri)=>(
                      <tr key={row.name}>
                        <td style={{padding:"9px 12px",borderRight:"2px solid #2d2d2d",borderBottom:"1px solid #1a1e28",position:"sticky",left:0,background:ri%2===0?"#141414":"#0f0f0f",zIndex:1,verticalAlign:"middle"}}>
                          <div style={{fontWeight:700,color:"#e8ecf4",fontSize:12}}>{row.name}</div>
                          {row.detail && <div style={{color:"#494949",fontSize:9.5,marginTop:2,lineHeight:1.4}}>{row.detail.split(" · ").slice(0,3).join(", ")}{row.detail.split(" · ").length>3?"…":""}</div>}
                        </td>
                        {SWITCH_COLS.map(col=>{
                          const key=`${row.name}|${col.name}`;
                          const cell=SWITCH_MATRIX[key];
                          if (!cell) return <td key={col.name} style={{background:"#0c0c0c",border:"1px solid #141820",padding:6}}><span style={{color:"#262626",display:"block",textAlign:"center"}}>?</span></td>;
                          const {i:instr,c:cat}=cell;
                          const s=CSTYLE[cat]||CSTYLE.std;
                          const isSame=cat==="same";
                          return (
                            <td key={col.name}
                              onClick={()=>!isSame&&setSwitchSel({from:row.name,fd:row.detail,to:col.name,td:col.detail,instruction:instr,cat})}
                              style={{padding:"7px 7px",background:s.bg,border:s.br,borderBottom:"1px solid #161a22",cursor:isSame?"default":"pointer",verticalAlign:"top",transition:"filter 0.1s"}}
                              onMouseEnter={e=>{if(!isSame)e.currentTarget.style.filter="brightness(1.55)";}}
                              onMouseLeave={e=>{e.currentTarget.style.filter="none";}}
                              title={isSame?"Same class":instr}
                            >
                              {isSame
                                ? <span style={{color:s.tx,display:"block",textAlign:"center",fontSize:15,lineHeight:"26px"}}>—</span>
                                : <span style={{color:s.tx,fontSize:11,lineHeight:1.5,display:"block"}}>{instr.length>68?instr.slice(0,66)+"…":instr}</span>
                              }
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div style={{marginTop:14,padding:"12px 16px",background:"#111111",borderRadius:8,border:"1px solid #1a1e28"}}>
                <div style={{fontSize:11,color:"#5b5b5b",lineHeight:1.9}}>
                  <strong style={{color:"#6d6d6d",display:"block",marginBottom:4}}>Clinical Notes</strong>
                  Click any cell to expand full instructions and drug group details. Washout periods are minimum recommendations — adjust for patient age, renal/hepatic function, and comorbidities. <span style={{color:"#6d6d6d"}}>Agomelatine and reboxetine are not FDA-approved in the US</span> (widely used internationally). <span style={{color:"#e05050"}}>MAOI switching requires strict tyramine dietary restrictions throughout the washout period.</span> Fluoxetine’s long-lived active metabolite (norfluoxetine t½ 4–16 days) necessitates a 5–6 week washout before an irreversible MAOI. Source: CINP (Collegium Internationale Neuro-Psychopharmacologicum) international consensus switching guidelines.
                </div>
              </div>
            </div>
          );
        })()}

        {/* ══════ CYP450 TABLE TAB ══════ */}
        {tab === "doseq" && <DoseEquivalencies />}

        {tab === "cyp" && (
          <div>
            <div style={{ marginBottom: 20 }}>
              <h2 style={{ fontSize: 20, fontWeight: 700, color: "#e8ecf4", marginBottom: 6 }}>CYP450 Drug Interaction Reference</h2>
              <p style={{ fontSize: 14, color: "#6d6d6d" }}>Click any drug to view its full profile. ● = potent inhibitor · ◐ = moderate inhibitor</p>
            </div>
            <div style={{ overflowX: "auto", borderRadius: 10, border: "1.5px solid #1e2535" }}>
              <table className="cyp-table">
                <thead>
                  <tr>
                    <th style={{ width: 100 }}>Enzyme</th>
                    <th style={{ color: "#93c5fd" }}>Substrates — metabolized by this enzyme</th>
                    <th style={{ color: "#f07878" }}>Inhibitors — ↑ substrate levels</th>
                    <th style={{ color: "#fb923c" }}>Inducers — ↓ substrate levels</th>
                  </tr>
                </thead>
                <tbody>
                  {CYP_ENZYMES.map((cyp, idx) => (
                    <tr key={cyp} style={{ background: idx % 2 === 0 ? "#141414" : "#0f0f0f" }}>
                      <td style={{ fontWeight: 700, color: "#5b8dee", fontSize: 16, fontFamily: "'JetBrains Mono', monospace", whiteSpace: "nowrap" }}>CYP{cyp}</td>
                      <td>
                        {cypTable[cyp].substrates.sort().map(d => (
                          <span key={d} className="pill-substrate" style={{ cursor: "pointer" }} onClick={() => { setTab("search"); setSelected(DRUG_DATA.find(x => x.generic === d)); setDetailTab("cyp"); }}>{d}</span>
                        ))}
                      </td>
                      <td>
                        {cypTable[cyp].inhibitors.sort((a,b) => a.drug.localeCompare(b.drug)).map(({ drug, note }) => (
                          <span key={drug} className="pill-inhibitor" style={{ cursor: "pointer" }} onClick={() => { setTab("search"); setSelected(DRUG_DATA.find(x => x.generic === drug)); setDetailTab("cyp"); }} title={note}>
                            {drug}{note.includes("potent") ? " ●" : note.includes("moderate") ? " ◐" : ""}
                          </span>
                        ))}
                      </td>
                      <td>
                        {cypTable[cyp].inducers.length > 0
                          ? cypTable[cyp].inducers.sort((a,b) => a.drug.localeCompare(b.drug)).map(({ drug }) => (
                              <span key={drug} className="pill-inducer" style={{ cursor: "pointer" }} onClick={() => { setTab("search"); setSelected(DRUG_DATA.find(x => x.generic === drug)); setDetailTab("cyp"); }}>{drug}</span>
                            ))
                          : <span style={{ color: "#444444", fontSize: 13 }}>—</span>
                        }
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {/* Elimination Pathways Table */}
            <div style={{ marginTop: 20, borderRadius: 10, border: "1.5px solid #1e2535", overflowX: "auto" }}>
              <div style={{ padding: "14px 18px 10px", background: "#111827", borderBottom: "1.5px solid #1e2535", display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 15, fontWeight: 700, color: "#e8ecf4" }}>Elimination &amp; Excretion Pathways</span>
                <span style={{ fontSize: 12, color: "#6d6d6d" }}>— route and % recovery for all drugs · source: FDA labels</span>
              </div>
              <table className="cyp-table">
                <thead>
                  <tr>
                    <th style={{ width: 160, color: "#e8ecf4" }}>Drug</th>
                    <th style={{ width: 90, color: "#6d6d6d", textAlign: "center" }}>Class</th>
                    <th style={{ color: "#a3e4a3" }}>Elimination / Excretion Route</th>
                  </tr>
                </thead>
                <tbody>
                  {DRUG_DATA.filter(d => d.excretion).map((d, idx) => (
                    <tr key={d.generic} style={{ background: idx % 2 === 0 ? "#141414" : "#0f0f0f" }}>
                      <td style={{ fontWeight: 600, color: "#c8dcf8", cursor: "pointer", fontSize: 13 }}
                          onClick={() => { setTab("search"); setSelected(d); setDetailTab("cyp"); }}>
                        {d.generic}
                      </td>
                      <td style={{ textAlign: "center" }}>
                        <span style={{
                          fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 4,
                          background: d.class.includes("SSRI") ? "#0d1f3c" : d.class.includes("SNRI") ? "#1a1a3a" : d.class.includes("SGA") || d.class.includes("Atypical") ? "#1a0a2e" : d.class.includes("FGA") || d.class.includes("Typical") ? "#0f1e0f" : d.class.includes("TCA") ? "#261a00" : d.class.includes("MAOI") ? "#2a0a0a" : "#1a1a1a",
                          color: d.class.includes("SSRI") ? "#60b4f0" : d.class.includes("SNRI") ? "#a78bfa" : d.class.includes("SGA") || d.class.includes("Atypical") ? "#d8b4fe" : d.class.includes("FGA") || d.class.includes("Typical") ? "#86efac" : d.class.includes("TCA") ? "#fbbf24" : d.class.includes("MAOI") ? "#f87171" : "#9d9d9d",
                          whiteSpace: "nowrap"
                        }}>
                          {d.class.includes("SSRI") ? "SSRI" : d.class.includes("SNRI") ? "SNRI" : d.class.includes("SGA") || d.class.includes("Atypical Antipsychotic") ? "SGA" : d.class.includes("FGA") || d.class.includes("Typical Antipsychotic") ? "FGA" : d.class.includes("TCA") || d.class.includes("Tricyclic") ? "TCA" : d.class.includes("MAOI") ? "MAOI" : d.class.includes("Mood Stab") ? "MS" : d.class.includes("Benzo") ? "BZD" : d.class.includes("Stimul") ? "Stim" : d.class.includes("Anticovuls") || d.class.includes("Anticonvulsant") ? "AC" : "—"}
                        </span>
                      </td>
                      <td style={{ fontSize: 13, color: "#c8e6c9", lineHeight: 1.5 }}>{d.excretion}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div style={{ marginTop: 20, background: "#0a1a0e", border: "1.5px solid #144a20", borderRadius: 10, padding: "18px 20px" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#4ade80", marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>Key Clinical DDI Interactions</div>
              <div style={{ fontSize: 14, color: "#86efac", lineHeight: 2.1 }}>
                {[
                  ["Fluvoxamine → Clozapine / Olanzapine", "Potent CYP1A2 inhibition — clozapine levels may rise 5–10×. Dangerous; monitor closely or avoid."],
                  ["Fluoxetine / Paroxetine → Tramadol", "2D6 inhibition blocks tramadol → M1 conversion; reduces analgesia and raises serotonin syndrome risk."],
                  ["Carbamazepine → Hormonal Contraceptives", "Potent 3A4 induction reduces OCP levels >50% — contraceptive failure. Use barrier method."],
                  ["Carbamazepine → Antipsychotics / Many Drugs", "Most potent psychiatric enzyme inducer — substantially reduces levels of haloperidol, quetiapine, valproate, and dozens of other drugs."],
                  ["Valproate → Lamotrigine (UGT)", "Inhibits UGT1A4 → doubles lamotrigine levels. Halve the lamotrigine dose when adding valproate."],
                  ["Smoking cessation → Clozapine / Olanzapine", "Smoking induces CYP1A2; cessation removes induction — drug levels rise 30–50% rapidly. Monitor."],
                  ["Nefazodone → 3A4 substrates", "Potent 3A4 inhibitor — markedly raises levels of benzodiazepines, statins, and other 3A4 drugs."],
                ].map(([title, detail]) => (
                  <div key={title} style={{ display: "flex", gap: 10, marginBottom: 4 }}>
                    <span style={{ color: "#4ade80", flexShrink: 0 }}>•</span>
                    <span><strong>{title}:</strong> {detail}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ══════ QTC PROLONGATION TAB ══════ */}
        {tab === "qtc" && <QTcChart setTab={setTab} setSelected={setSelected} setDetailTab={setDetailTab} />}

        {/* ══════ ABOUT TAB ══════ */}
        {tab === "about" && (
          <div style={{ maxWidth: 720 }}>
            <h2 style={{ fontSize: 20, fontWeight: 700, color: "#e8ecf4", marginBottom: 16 }}>About PsychoPharm PK/PD Reference</h2>
            <div className="info-card" style={{ marginBottom: 14, lineHeight: 1.85, fontSize: 14 }}>
              <p style={{ marginBottom: 12 }}>This reference covers <strong style={{ color: "#60b4f0" }}>{DRUG_DATA.length} psychiatric and cross-discipline medications</strong> across all major drug classes, including traditional psychotropics, cross-discipline agents (propranolol for akathisia, prazosin for PTSD nightmares, gabapentin, naltrexone, buprenorphine), and novel agents (esketamine, zuranolone, xanomeline-trospium, lumateperone).</p>
              <p style={{ marginBottom: 12 }}>Per-formulation PK data covers <strong style={{ color: "#60b4f0" }}>92 formulation entries</strong> — comparing delivery systems (IR, ER, XL, OROS, ODT, LAI, transdermal, sublingual, IV) for {Object.keys(FORMULATIONS).length} multi-formulation drugs.</p>
              <p>All reference links point to <strong style={{ color: "#60b4f0" }}>DailyMed (NIH/NLM)</strong> and <strong style={{ color: "#60b4f0" }}>FDA Drugs@FDA</strong> — stable, current sources updated with each label revision. FDA indications are clearly distinguished from off-label uses throughout.</p>
            </div>
            <div className="info-card" style={{ background: "#1a0808", borderColor: "#6b1414", lineHeight: 1.85, fontSize: 14 }}>
              <div style={{ fontWeight: 700, color: "#e06060", marginBottom: 8, fontSize: 15 }}>⚠ Disclaimer</div>
              <p>This tool is for <strong>educational and reference purposes only</strong>. It is not a substitute for clinical judgment, current FDA-approved prescribing information, or patient-specific consultation with a physician or pharmacist. Always verify against the most current DailyMed label before prescribing. Drug information is subject to change.</p>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

  </script>

  <script>
    document.getElementById('splash-sub').textContent = 'Compiling…';
    setTimeout(function() {
      try {
        var source = document.getElementById('app-source').textContent;
        var compiled = Babel.transform(source, { presets: ['react'] }).code;
        var mountScript = compiled + `\n
          var container = document.getElementById('root');
          var reactRoot = ReactDOM.createRoot(container);
          var observer = new MutationObserver(function(mutations) {
            var hasContent = mutations.some(function(m) {
              return Array.from(m.addedNodes).some(function(n) { return n.nodeType === 1; });
            });
            if (hasContent) {
              observer.disconnect();
              var splash = document.getElementById('splash');
              if (splash) { splash.classList.add('hidden'); setTimeout(function() { splash.remove(); }, 500); }
            }
          });
          observer.observe(container, { childList: true, subtree: false });
          setTimeout(function() {
            observer.disconnect();
            var splash = document.getElementById('splash');
            if (splash) splash.remove();
          }, 5000);
          reactRoot.render(React.createElement(App));
        `;
        var el = document.createElement('script');
        el.textContent = mountScript;
        document.body.appendChild(el);
      } catch (err) {
        console.error('Babel compilation failed:', err);
        document.getElementById('splash-sub').textContent = 'Error loading app. See console.';
        document.getElementById('splash-sub').style.color = '#f87171';
        document.getElementById('splash-dot').style.background = '#7f2020';
      }
    }, 50);
  </script>

  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'www.claudeusercontent.com') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('[SW] Registered, scope:', reg.scope);
            navigator.serviceWorker.addEventListener('message', event => {
              if (event.data && event.data.type === 'SW_UPDATE_READY') showUpdateBanner(reg);
            });
          })
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }

    function showUpdateBanner(reg) {
      if (document.getElementById('sw-update-banner')) return;
      const banner = document.createElement('div');
      banner.id = 'sw-update-banner';
      banner.style.cssText = [
        'position:fixed','bottom:16px','left:50%','transform:translateX(-50%)',
        'background:#1e2840','border:1.5px solid #5b8dee','border-radius:10px',
        'padding:12px 18px','display:flex','align-items:center','gap:12px',
        'font-family:system-ui,sans-serif','font-size:13px','color:#c8d0e0',
        'box-shadow:0 4px 24px rgba(0,0,0,0.5)','z-index:99999',
        'max-width:calc(100vw - 32px)'
      ].join(';');
      banner.innerHTML = `
        <span>Update available</span>
        <button id="sw-reload-btn" style="background:#5b8dee;color:#fff;border:none;
          border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;
          cursor:pointer;white-space:nowrap">Reload</button>
        <button id="sw-dismiss-btn" style="background:none;border:none;color:#6d6d6d;
          font-size:16px;cursor:pointer;padding:0 2px;line-height:1">&#x2715;</button>
      `;
      document.body.appendChild(banner);
      document.getElementById('sw-reload-btn').onclick = () => {
        if (reg.waiting) reg.waiting.postMessage({ type: 'SW_SKIP_WAITING' });
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
      };
      document.getElementById('sw-dismiss-btn').onclick = () => banner.remove();
    }
  </script>
</body>
