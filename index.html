function App() {
  const [tab, setTab] = useState("search");
  const [query, setQuery] = useState("");
  const [filterGroup, setFilterGroup] = useState("All");
  const [selected, setSelected] = useState(null);
  const [detailTab, setDetailTab] = useState("pk");
  const [switchSel, setSwitchSel] = useState(null);

  const UNIQUE_GROUPS = useMemo(() => {
    const seen = new Set();
    const result = [];
    GROUP_ORDER.forEach(g => {
      if (DRUG_DATA.some(d => getGroup(d.class) === g)) {
        if (!seen.has(g)) { seen.add(g); result.push(g); }
      }
    });
    return result;
  }, []);

  const filtered = useMemo(() => {
    const q = query.toLowerCase();
    return DRUG_DATA.filter(d => {
      const matchGroup = filterGroup === "All" || getGroup(d.class) === filterGroup;
      const matchQuery = !q ||
        d.generic.toLowerCase().includes(q) ||
        d.brand.toLowerCase().includes(q) ||
        d.class.toLowerCase().includes(q) ||
        d.indications.some(i => i.toLowerCase().includes(q)) ||
        d.mechanismOfAction.toLowerCase().includes(q) ||
        (FDA_INDICATIONS[d.generic] || []).some(i => i.toLowerCase().includes(q));
      return matchGroup && matchQuery;
    }).sort((a, b) => a.generic.localeCompare(b.generic));
  }, [query, filterGroup]);

  const cypTable = useMemo(() => {
    const result = {};
    CYP_ENZYMES.forEach(cyp => { result[cyp] = { substrates: [], inhibitors: [], inducers: [] }; });
    DRUG_DATA.forEach(drug => {
      drug.cyp.substrate.forEach(s => {
        const match = CYP_ENZYMES.find(e => s.includes(e));
        if (match) result[match].substrates.push(drug.generic);
      });
      drug.cyp.inhibits.forEach(s => {
        const match = CYP_ENZYMES.find(e => s.includes(e));
        if (match) result[match].inhibitors.push({ drug: drug.generic, note: s });
      });
      drug.cyp.induces.forEach(s => {
        const match = CYP_ENZYMES.find(e => s.includes(e));
        if (match) result[match].inducers.push({ drug: drug.generic, note: s });
      });
    });
    return result;
  }, []);

  const gs = selected ? getGroupStyle(selected.class) : null;
  const qtcColor = (qtc) => {
    const q = (qtc || "").toLowerCase();
    if (q.includes("significant") || q.includes("highest")) return "#f07878";
    if (q.includes("moderate")) return "#e8a840";
    if (q.includes("mild")) return "#f5d170";
    return "#4ade80";
  };

  return (
    <div style={{ fontFamily: "'Inter', 'Segoe UI', system-ui, sans-serif", background: "#10131a", minHeight: "100vh", color: "#d4dae8" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        /* ── Reset & base ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Indication tags ── */

        .tag-fda {
          display: inline-flex; align-items: center; gap: 5px;
          padding: 4px 11px; border-radius: 5px; font-size: 13px;
          font-weight: 500; margin: 3px;
          background: #0a1f36; color: #60b4f0; border: 1px solid #1a4370;

          padding: 4px 11px; border-radius: 5px; font-size: 13px;
          font-weight: 500; margin: 3px;
          background: #160d28; color: #b58af5; border: 1px solid #3b2070;
        }
        /* Side effects: warm amber-red — warns without being alarming */
        .tag-se {
          display: inline-flex; align-items: center;
          padding: 4px 11px; border-radius: 5px; font-size: 13px;
          font-weight: 500; margin: 3px;
          background: #1e1008; color: #f5a76a; border: 1px solid #5c2e0a;

        .badge-route {

          padding: 3px 9px; border-radius: 4px; letter-spacing: 0.02em;

          background: #10131a; border-radius: 7px;

        .form-pk-label {

          text-transform: uppercase; color: #4a5570; margin-bottom: 5px;

        a { color: #5b8dee; text-decoration: none; transition: color 0.14s; }

        /* ── Misc ── */
        .results-count { font-size: 13px; color: #4a5570; margin-bottom: 16px; }

        @media (max-width: 640px) {
          .pk-grid-main { grid-template-columns: 1fr; }
          .form-pk-grid { grid-template-columns: 1fr 1fr; }
        }

  <script>
    // Step 1: update splash text now (synchronous, before Babel blocks thread)
    document.getElementById('splash-sub').textContent = 'Compiling app…';

    // Step 2: yield to browser so the splash text update actually paints
    setTimeout(function() {
      try {
        var source = document.getElementById('app-source').textContent;

        // Step 3: compile JSX → JS via Babel
        var compiled = Babel.transform(source, { presets: ['react'] }).code;

        // Step 4: inject compiled JS and mount React
        var mountScript = compiled + `\n
          var container = document.getElementById('root');
          var reactRoot = ReactDOM.createRoot(container);

          // MutationObserver: hide splash only once React has committed real DOM nodes
          var observer = new MutationObserver(function(mutations) {
            var hasContent = mutations.some(function(m) {
              return Array.from(m.addedNodes).some(function(n) {
                return n.nodeType === 1; // Element node
              });
            });
            if (hasContent) {
              observer.disconnect();
              var splash = document.getElementById('splash');
              if (splash) {
                splash.classList.add('hidden');
                setTimeout(function() { splash.remove(); }, 500);
              }
            }
          });
          observer.observe(container, { childList: true, subtree: false });

          // 5-second fallback: hide splash even if observer misfires
          var splashTimeout = setTimeout(function() {
            observer.disconnect();
            var splash = document.getElementById('splash');
            if (splash) splash.remove();
          }, 5000);

          reactRoot.render(React.createElement(App));
        `;

        var el = document.createElement('script');
        el.textContent = mountScript;
        document.body.appendChild(el);

      } catch (err) {
        // Show error in splash so user isn't stuck on a dark screen forever
        console.error('Babel compilation failed:', err);
        document.getElementById('splash-sub').textContent = 'Error loading app. See console.';
        document.getElementById('splash-sub').style.color = '#f87171';
        document.getElementById('splash-dot').style.background = '#7f2020';
      }
    }, 50); // 50ms is enough to yield a paint cycle
  </script>


  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('[SW] Registered, scope:', reg.scope);

            // Listen for the SW signalling a new version is cached in background
            navigator.serviceWorker.addEventListener('message', event => {
              if (event.data?.type === 'SW_UPDATE_READY') {
                showUpdateBanner(reg);
              }
            });
          })
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }

    function showUpdateBanner(reg) {
      // Don't show twice
      if (document.getElementById('sw-update-banner')) return;

      const banner = document.createElement('div');
      banner.id = 'sw-update-banner';
      banner.style.cssText = [
        'position:fixed','bottom:16px','left:50%','transform:translateX(-50%)',
        'background:#1e2840','border:1.5px solid #5b8dee','border-radius:10px',
        'padding:12px 18px','display:flex','align-items:center','gap:12px',
        'font-family:system-ui,sans-serif','font-size:13px','color:#c8d0e0',
        'box-shadow:0 4px 24px rgba(0,0,0,0.5)','z-index:99999',
        'max-width:calc(100vw - 32px)'
      ].join(';');
      banner.innerHTML = `
        <span>Update available</span>
        <button id="sw-reload-btn" style="background:#5b8dee;color:#fff;border:none;
          border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;
          cursor:pointer;white-space:nowrap">Reload</button>
        <button id="sw-dismiss-btn" style="background:none;border:none;color:#5a6580;
          font-size:16px;cursor:pointer;padding:0 2px;line-height:1">✕</button>
      `;
      document.body.appendChild(banner);

      document.getElementById('sw-reload-btn').onclick = () => {
        // Tell the waiting SW to take over, then reload
        if (reg.waiting) reg.waiting.postMessage({ type: 'SW_SKIP_WAITING' });
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
      };
      document.getElementById('sw-dismiss-btn').onclick = () => banner.remove();
    }
  </script>
